name: Validate research repository

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install validation environment
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check src scripts tests
      - name: Test
        run: pytest
      - name: Validate notebooks and archived summaries
        run: python scripts/validate_repository.py
